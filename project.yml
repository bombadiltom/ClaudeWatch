name: ClaudeWatch
options:
  bundleIdPrefix: de.idiotentruppe
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClaudeWatch:
    type: application
    platform: macOS
    sources:
      - ClaudeWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.idiotentruppe.claudewatch
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ClaudeWatch/Info.plist
      properties:
        CFBundleDisplayName: ClaudeWatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
  ClaudeWatchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ClaudeWatchTests
    dependencies:
      - target: ClaudeWatch
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ClaudeWatch.app/Contents/MacOS/ClaudeWatch
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  ClaudeWatch:
    build:
      targets:
        ClaudeWatch: all
        ClaudeWatchTests: [test]
    test:
      targets:
        - ClaudeWatchTests
