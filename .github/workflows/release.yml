# Builds, signs, notarizes and publishes ClaudeWatch.
#
# - Pushing a tag v<version> (scripts/release.sh <version> does that) publishes a GitHub
#   release and updates the cask in bombadiltom/homebrew-tap.
# - Running it manually ("Run workflow") only builds and notarizes, then attaches the zip as a
#   workflow artifact. It never publishes. Use it to check that signing still works.
#
# Required repository secrets (scripts/setup-ci-secrets.sh sets them):
#   DEVELOPER_ID_P12           base64 of the exported "Developer ID Application" certificate + key
#   DEVELOPER_ID_P12_PASSWORD  password of that .p12
#   NOTARY_APPLE_ID            Apple ID used for notarization
#   NOTARY_PASSWORD            app-specific password for that Apple ID
#   TAP_DEPLOY_KEY             SSH private key of a deploy key with write access to the tap
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.1 (manual runs only build and notarize, they never publish)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TEAM_ID: K6QN2C7Q55
  NOTARY_PROFILE: BombadilTom

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up signing keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -f pkcs12 \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/developer-id.p12"

          # The Developer ID G2 intermediate isn't guaranteed to be on the runner.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          xcrun notarytool store-credentials "$NOTARY_PROFILE" --keychain "$KEYCHAIN" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD"

          echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, notarize and publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: scripts/release.sh "${GITHUB_REF_NAME#v}" --publish-existing-tag

      - name: Build and notarize (no publishing)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/release.sh "$VERSION" --build-only

      - name: Upload zip
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeWatch-${{ inputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${NOTARY_KEYCHAIN:-}" ]; then security delete-keychain "$NOTARY_KEYCHAIN" || true; fi
